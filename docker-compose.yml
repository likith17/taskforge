services:
  db:
    image: postgres:16-alpine
    container_name: taskforge-db
    environment:
      POSTGRES_USER: taskforge
      POSTGRES_PASSWORD: ${TASKFORGE_DB_PASSWORD:-taskforge} # dev default; override via .env
      POSTGRES_DB: taskforge
    ports:
      - "127.0.0.1:5434:5432" # loopback only
    volumes:
      - taskforge-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskforge -d taskforge"]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  taskforge-pgdata:
